apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-front-end-back-end-api
spec:
  podSelector:
    matchExpressions:
      - key: role
        operator: In
        values: ["front-end", "back-end-api"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: role
                operator: In
                values: ["front-end", "back-end-api"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-admin-front-end-admin-back-end-api
spec:
  podSelector:
    matchExpressions:
      - key: role
        operator: In
        values: ["admin-front-end", "admin-back-end-api"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: role
                operator: In
                values: ["admin-front-end", "admin-back-end-api"]
