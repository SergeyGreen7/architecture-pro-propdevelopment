apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srunasnonroot
spec:
  crd:
    spec:
      names:
        kind: K8sRunAsNonRoot
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srunasnonroot

        containers[c] { c := input.review.object.spec.containers[_] }
        containers[c] { c := input.review.object.spec.initContainers[_] }

        # runAsNonRoot можно задать на уровне контейнера или всего пода
        non_root(c) { c.securityContext.runAsNonRoot == true }
        non_root(c) {
          not c.securityContext.runAsNonRoot == false
          input.review.object.spec.securityContext.runAsNonRoot == true
        }

        violation[{"msg": msg}] {
          c := containers[_]
          not non_root(c)
          msg := sprintf("container %v: runAsNonRoot: true is required", [c.name])
        }

        violation[{"msg": msg}] {
          c := containers[_]
          not c.securityContext.readOnlyRootFilesystem == true
          msg := sprintf("container %v: readOnlyRootFilesystem: true is required", [c.name])
        }
